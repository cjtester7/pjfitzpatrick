# FILE:    netlify.toml
# VERSION: v16
# UPDATED: 2026-05-05 03:50
# CHANGES: v16 (CR012 cont): Points to index-v16.html.

[build]
  publish = "."
  functions = "netlify/functions"

[[redirects]]
  from   = "/.netlify/functions/*"
  to     = "/.netlify/functions/:splat"
  status = 200

[[redirects]]
  from   = "/"
  to     = "/index-v16.html"
  status = 200
