# FILE:    netlify.toml
# VERSION: v1
# UPDATED: 2026-05-04
# CHANGES: v1: Initial release. Points to index-v1.html. Defines functions path for Claude proxy.

[build]
  publish = "."
  functions = "netlify/functions"

# Allow Netlify Functions passthrough
[[redirects]]
  from   = "/.netlify/functions/*"
  to     = "/.netlify/functions/:splat"
  status = 200

# Route root to current version
[[redirects]]
  from   = "/"
  to     = "/index-v1.html"
  status = 200
