# FILE:    netlify.toml
# VERSION: v21
# UPDATED: 2026-05-07 10:00
# CHANGES: v21 (CR012 cont): Points to index-v21.html.

[build]
  publish = "."
  functions = "netlify/functions"

[[redirects]]
  from   = "/.netlify/functions/*"
  to     = "/.netlify/functions/:splat"
  status = 200

[[redirects]]
  from   = "/"
  to     = "/index-v21.html"
  status = 200
