# FILE:    netlify.toml
# VERSION: v15
# UPDATED: 2026-05-05 03:30
# CHANGES: v15 (CR012 cont): Points to index-v15.html.

[build]
  publish = "."
  functions = "netlify/functions"

[[redirects]]
  from   = "/.netlify/functions/*"
  to     = "/.netlify/functions/:splat"
  status = 200

[[redirects]]
  from   = "/"
  to     = "/index-v15.html"
  status = 200
