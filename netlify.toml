# FILE:    netlify.toml
# VERSION: v20
# UPDATED: 2026-05-07 09:45
# CHANGES: v20 (CR012 cont): Points to index-v20.html.

[build]
  publish = "."
  functions = "netlify/functions"

[[redirects]]
  from   = "/.netlify/functions/*"
  to     = "/.netlify/functions/:splat"
  status = 200

[[redirects]]
  from   = "/"
  to     = "/index-v20.html"
  status = 200
