# FILE:    netlify.toml
# VERSION: v19
# UPDATED: 2026-05-07 09:30
# CHANGES: v19 (CR012 cont): Points to index-v19.html.

[build]
  publish = "."
  functions = "netlify/functions"

[[redirects]]
  from   = "/.netlify/functions/*"
  to     = "/.netlify/functions/:splat"
  status = 200

[[redirects]]
  from   = "/"
  to     = "/index-v19.html"
  status = 200
