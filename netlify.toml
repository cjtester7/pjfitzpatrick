# FILE:    netlify.toml
# VERSION: v12
# UPDATED: 2026-05-05 02:35
# CHANGES: v12 (CR012): Points to index-v12.html.

[build]
  publish = "."
  functions = "netlify/functions"

[[redirects]]
  from   = "/.netlify/functions/*"
  to     = "/.netlify/functions/:splat"
  status = 200

[[redirects]]
  from   = "/"
  to     = "/index-v12.html"
  status = 200
