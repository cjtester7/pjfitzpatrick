# FILE:    netlify.toml
# VERSION: v11
# UPDATED: 2026-05-05 02:20
# CHANGES: v11 (CR011/CR010): Points to index-v11.html. CR010 slim header applied.

[build]
  publish = "."
  functions = "netlify/functions"

[[redirects]]
  from   = "/.netlify/functions/*"
  to     = "/.netlify/functions/:splat"
  status = 200

[[redirects]]
  from   = "/"
  to     = "/index-v11.html"
  status = 200
