# FILE:    netlify.toml
# VERSION: v14
# UPDATED: 2026-05-05 03:05
# CHANGES: v14 (CR012 cont): Points to index-v14.html.

[build]
  publish = "."
  functions = "netlify/functions"

[[redirects]]
  from   = "/.netlify/functions/*"
  to     = "/.netlify/functions/:splat"
  status = 200

[[redirects]]
  from   = "/"
  to     = "/index-v14.html"
  status = 200
