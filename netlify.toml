# FILE:    netlify.toml
# VERSION: v17
# UPDATED: 2026-05-05 04:10
# CHANGES: v17 (CR012 cont): Points to index-v17.html.

[build]
  publish = "."
  functions = "netlify/functions"

[[redirects]]
  from   = "/.netlify/functions/*"
  to     = "/.netlify/functions/:splat"
  status = 200

[[redirects]]
  from   = "/"
  to     = "/index-v17.html"
  status = 200
