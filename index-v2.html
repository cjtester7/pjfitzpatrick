<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PJ — AI Roofing Advisor | PJ Fitzpatrick</title>

  <!-- Google Fonts: Sora (display) + Source Sans 3 (body) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&family=Source+Sans+3:wght@400;500;600&display=swap" rel="stylesheet" />

  <style>
    /* ── CSS Variables ─────────────────────────────────────── */
    :root {
      --navy:       #0a2d6e;
      --navy-light: #0f3d94;
      --red:        #c8102e;
      --red-dark:   #a60e26;
      --white:      #ffffff;
      --offwhite:   #f5f6f9;
      --gray-100:   #eef0f5;
      --gray-300:   #c5c9d8;
      --gray-500:   #7a80a0;
      --gray-700:   #3e4360;
      --text:       #1c2340;
      --shadow:     0 4px 24px rgba(10,45,110,0.13);
      --radius:     14px;
      --radius-sm:  8px;
      --font-display: 'Sora', sans-serif;
      --font-body:    'Source Sans 3', sans-serif;
      --chat-max:   780px;
    }

    /* ── Reset ─────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }

    body {
      font-family: var(--font-body);
      background: var(--offwhite);
      color: var(--text);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    /* ── Header ────────────────────────────────────────────── */
    .site-header {
      background: var(--navy);
      color: var(--white);
      padding: 0 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 60px;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 2px 12px rgba(0,0,0,0.25);
    }

    .header-brand {
      display: flex;
      align-items: center;
      gap: 11px;
    }

    .header-logo {
      width: 38px;
      height: 38px;
      background: var(--red);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      flex-shrink: 0;
    }

    .header-title {
      font-family: var(--font-display);
      font-size: 1.05rem;
      font-weight: 700;
      line-height: 1.2;
    }

    .header-sub {
      font-size: 0.72rem;
      color: var(--gray-300);
      font-weight: 400;
    }

    .header-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.72rem;
      color: #7be07b;
      font-weight: 600;
    }

    .badge-dot {
      width: 8px;
      height: 8px;
      background: #4cce4c;
      border-radius: 50%;
      animation: pulse-dot 2s ease-in-out infinite;
    }

    @keyframes pulse-dot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.6; transform: scale(0.85); }
    }

    /* ── Controls Bar ──────────────────────────────────────── */
    .controls-bar {
      background: var(--white);
      border-bottom: 1px solid var(--gray-100);
      padding: 10px 20px;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .ctrl-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 14px;
      border-radius: 20px;
      font-family: var(--font-body);
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      border: 2px solid transparent;
      transition: all 0.18s ease;
      white-space: nowrap;
    }

    .ctrl-btn .icon { font-size: 0.9rem; }

    .btn-start {
      background: var(--navy);
      color: var(--white);
      border-color: var(--navy);
    }
    .btn-start:hover { background: var(--navy-light); border-color: var(--navy-light); }

    .btn-end {
      background: transparent;
      color: var(--red);
      border-color: var(--red);
    }
    .btn-end:hover { background: var(--red); color: var(--white); }

    .btn-export {
      background: transparent;
      color: var(--gray-700);
      border-color: var(--gray-300);
    }
    .btn-export:hover { background: var(--gray-100); border-color: var(--gray-500); }

    .ctrl-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      pointer-events: none;
    }

    /* ── Chat Window ───────────────────────────────────────── */
    .chat-wrapper {
      flex: 1;
      display: flex;
      flex-direction: column;
      max-width: var(--chat-max);
      width: 100%;
      margin: 0 auto;
      padding: 20px 16px 0;
    }

    .chat-messages {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
      padding-bottom: 16px;
    }

    /* ── Message Bubbles ───────────────────────────────────── */
    .msg-row {
      display: flex;
      align-items: flex-end;
      gap: 10px;
      animation: fadeUp 0.22s ease;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .msg-row.user { flex-direction: row-reverse; }

    .msg-avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      background: var(--navy);
      color: var(--white);
      box-shadow: 0 2px 8px rgba(10,45,110,0.2);
    }

    .msg-row.user .msg-avatar {
      background: var(--gray-300);
      color: var(--gray-700);
    }

    .msg-content-wrap {
      max-width: 75%;
    }

    .msg-bubble {
      padding: 12px 16px;
      border-radius: 18px;
      font-size: 0.92rem;
      line-height: 1.6;
      word-break: break-word;
    }

    .msg-row.bot .msg-bubble {
      background: var(--white);
      color: var(--text);
      border-bottom-left-radius: 4px;
      box-shadow: var(--shadow);
    }

    .msg-row.user .msg-bubble {
      background: var(--navy);
      color: var(--white);
      border-bottom-right-radius: 4px;
    }

    .msg-bubble a {
      color: var(--red);
      text-decoration: underline;
      word-break: break-all;
    }

    .msg-row.user .msg-bubble a {
      color: #9ecbff;
    }

    .msg-time {
      font-size: 0.68rem;
      color: var(--gray-500);
      margin-top: 4px;
      padding: 0 4px;
    }

    .msg-row.user .msg-time { text-align: right; }

    /* ── More / Less Toggle ────────────────────────────────── */
    .msg-truncated .msg-text-full { display: none; }
    .msg-truncated .msg-text-short { display: inline; }
    .msg-expanded .msg-text-full { display: inline; }
    .msg-expanded .msg-text-short { display: none; }

    .toggle-more {
      background: none;
      border: none;
      color: var(--red);
      font-size: 0.82rem;
      font-weight: 700;
      cursor: pointer;
      padding: 0 2px;
      text-decoration: underline;
      font-family: var(--font-body);
    }

    /* ── Main Menu ─────────────────────────────────────────── */
    .main-menu {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      margin-top: 10px;
    }

    .menu-btn {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 7px 13px;
      border-radius: 20px;
      font-family: var(--font-body);
      font-size: 0.8rem;
      font-weight: 600;
      border: 2px solid var(--navy);
      background: transparent;
      color: var(--navy);
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .menu-btn:hover {
      background: var(--navy);
      color: var(--white);
    }

    /* ── Typing Indicator ──────────────────────────────────── */
    .typing-row { display: none; }
    .typing-row.visible { display: flex; }

    .typing-bubble {
      background: var(--white);
      border-radius: 18px;
      border-bottom-left-radius: 4px;
      padding: 12px 18px;
      box-shadow: var(--shadow);
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .typing-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--gray-300);
      animation: blink 1.2s ease-in-out infinite;
    }

    .typing-dot:nth-child(2) { animation-delay: 0.2s; }
    .typing-dot:nth-child(3) { animation-delay: 0.4s; }

    @keyframes blink {
      0%, 80%, 100% { opacity: 0.3; transform: scale(0.85); }
      40%           { opacity: 1;   transform: scale(1); }
    }

    /* ── Input Area ────────────────────────────────────────── */
    .input-area {
      background: var(--white);
      border-top: 1px solid var(--gray-100);
      padding: 12px 16px;
      display: flex;
      gap: 10px;
      align-items: flex-end;
      position: sticky;
      bottom: 0;
      max-width: var(--chat-max);
      width: 100%;
      margin: 0 auto;
    }

    .input-field {
      flex: 1;
      min-height: 44px;
      max-height: 120px;
      padding: 11px 15px;
      border: 2px solid var(--gray-300);
      border-radius: 22px;
      font-family: var(--font-body);
      font-size: 0.92rem;
      color: var(--text);
      outline: none;
      resize: none;
      overflow-y: auto;
      line-height: 1.4;
      transition: border-color 0.18s;
    }

    .input-field:focus { border-color: var(--navy); }
    .input-field:disabled { background: var(--gray-100); color: var(--gray-500); }
    .input-field::placeholder { color: var(--gray-500); }

    .send-btn {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: var(--navy);
      border: none;
      color: var(--white);
      font-size: 1.1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: background 0.18s, transform 0.1s;
    }

    .send-btn:hover { background: var(--navy-light); }
    .send-btn:active { transform: scale(0.94); }
    .send-btn:disabled { background: var(--gray-300); cursor: not-allowed; }

    /* ── Disclaimer Footer ─────────────────────────────────── */
    .chat-footer {
      text-align: center;
      font-size: 0.68rem;
      color: var(--gray-500);
      padding: 8px 16px 12px;
      max-width: var(--chat-max);
      margin: 0 auto;
      width: 100%;
    }

    /* ── Mobile ────────────────────────────────────────────── */
    @media (max-width: 500px) {
      .header-title { font-size: 0.95rem; }
      .header-sub   { display: none; }
      .ctrl-btn     { padding: 6px 10px; font-size: 0.78rem; }
      .ctrl-btn .icon { display: block; }
      .chat-wrapper  { padding: 12px 10px 0; }
      .msg-content-wrap { max-width: 85%; }
      .menu-btn      { font-size: 0.76rem; padding: 6px 10px; }
    }
  </style>
</head>
<body>

<!-- ── Header ─────────────────────────────────────────────────────────────── -->
<header class="site-header">

<!-- ── Input Area ─────────────────────────────────────────────────────────── -->
<div class="input-area">

    ➤
  </button>

  PJ is an AI assistant. For emergencies, call <a href="tel:18772464354" style="color:var(--red)">1-877-246-4354</a>.

<script>
// ─────────────────────────────────────────────────────────────────────────────
// Configuration
// ─────────────────────────────────────────────────────────────────────────────
// Replace YOUR_GOOGLE_SHEET_URL_HERE with your deployed Apps Script web app URL
var APPS_SCRIPT_URL = "Replace YOUR_GOOGLE_SHEET_URL_HERE";

var PROXY_URL = "/.netlify/functions/claude-proxy";

var SYSTEM_PROMPT = "You are PJ, the friendly and knowledgeable AI roofing advisor for PJ Fitzpatrick — America's Roofing Company. PJ Fitzpatrick has served DE, PA, NJ, MD, NY, OH, and VA since 1980, specializing in roofing, windows, siding, gutters, doors, and bath remodeling.\n\n" +
  "Your role is to answer homeowner questions, help visitors understand services, provide general guidance, and capture lead information from interested visitors. Always be warm, professional, and confident.\n\n" +
  "IMPORTANT RULES:\n" +
  "- Keep every response to a maximum of 3 sentences. No exceptions.\n" +
  "- Never make up specific prices — instead say: We offer free estimates so you get an exact number.\n" +
  "- Service area: DE, PA, NJ, MD, NY, OH, VA. If someone asks about a state outside this list, politely let them know.\n" +
  "- For emergencies (active roof leaks, storm damage), always provide the phone number: 1-877-246-4354.\n" +
  "- Do not recommend competitors. If you cannot help, offer to connect them with a team member.\n" +
  "- When relevant, mention PJ Fitzpatrick's 45-year history and 94.7% customer recommendation rate as trust signals.\n" +
  "- NEVER send users to an external URL unprompted. Only share https://www.pjfitz.com/contact-us/ if the user explicitly asks for a link.\n\n" +
  "LEAD CAPTURE RULES (follow this sequence precisely):\n" +
  "- Whenever a user expresses interest in a service, wants a quote, asks about pricing, mentions a project, or seems ready to move forward — begin the lead capture sequence.\n" +
  "- Ask for information ONE question at a time in this exact order: (1) their first and last name, (2) their email address, (3) their phone number.\n" +
  "- Do not ask for all three at once. Wait for each answer before asking the next question.\n" +
  "- After collecting all three, confirm with a warm closing message: let them know a PJ Fitzpatrick team member will be in touch shortly to help them.\n" +
  "- If the user declines to provide contact info, respect that and offer to answer any other questions instead.";

// ─────────────────────────────────────────────────────────────────────────────
// State
// ─────────────────────────────────────────────────────────────────────────────
var conversationHistory = [];
var sessionId           = "";
var conversationActive  = false;
var transcriptLines     = [];

// ─────────────────────────────────────────────────────────────────────────────
// Utility: UUID v4 generator
// ─────────────────────────────────────────────────────────────────────────────
function generateUUID() {
  return "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g, function(c) {
    var r = (Math.random() * 16) | 0;
    var v = c === "x" ? r : (r & 0x3) | 0x8;
    return v.toString(16);
  });
}

// ─────────────────────────────────────────────────────────────────────────────
// Utility: Format timestamp for display (local timezone from ISO string)
// ─────────────────────────────────────────────────────────────────────────────
function formatTime(isoString) {
  var d = new Date(isoString);
  // Extract hours/minutes in user local timezone
  var h = d.getHours();
  var m = d.getMinutes().toString().padStart(2, "0");
  var ampm = h >= 12 ? "PM" : "AM";
  h = h % 12 || 12;
  return h + ":" + m + " " + ampm;
}

// ─────────────────────────────────────────────────────────────────────────────
// Utility: Convert URLs in text to clickable hyperlinks
// ─────────────────────────────────────────────────────────────────────────────
function linkify(text) {
  var urlRegex = /(https?:\/\/[^\s<>"]+)/g;
  return text.replace(urlRegex, function(url) {
    return '<a href="' + url + '" target="_blank" rel="noopener">' + url + '</a>';
  });
}

// ─────────────────────────────────────────────────────────────────────────────
// Utility: Truncate long messages with More/Less toggle
// ─────────────────────────────────────────────────────────────────────────────
var TRUNCATE_CHARS = 300;

function buildMessageContent(text) {
  var linked = linkify(text);

  if (text.length <= TRUNCATE_CHARS) {
    return '<span>' + linked + '</span>';
  }

  // Find a clean break point near TRUNCATE_CHARS
  var shortText = text.substring(0, TRUNCATE_CHARS);
  var lastSpace = shortText.lastIndexOf(" ");
  if (lastSpace > 200) { shortText = text.substring(0, lastSpace); }

  var shortLinked = linkify(shortText);
  var fullLinked  = linkify(text);
  var uid = "msg-" + Math.random().toString(36).substr(2, 8);

  return (
    '<span class="msg-truncated" id="' + uid + '">' +
      '<span class="msg-text-short">' + shortLinked + '… </span>' +
      '<span class="msg-text-full">' + fullLinked + ' </span>' +
      '<button class="toggle-more" onclick="toggleMore(\'' + uid + '\', this)">More</button>' +
    '</span>'
  );
}

function toggleMore(id, btn) {
  var el = document.getElementById(id);
  if (!el) { return; }
  if (el.classList.contains("msg-truncated")) {
    el.classList.remove("msg-truncated");
    el.classList.add("msg-expanded");
    btn.textContent = "Less";
  } else {
    el.classList.remove("msg-expanded");
    el.classList.add("msg-truncated");
    btn.textContent = "More";
  }
}

// ─────────────────────────────────────────────────────────────────────────────
// Render: Append a message bubble
// ─────────────────────────────────────────────────────────────────────────────
function appendMessage(role, text, ts) {
  var messages = document.getElementById("chatMessages");
  var typingRow = document.getElementById("typingRow");

  var now = ts || new Date().toISOString();
  var timeStr = formatTime(now);

  var row = document.createElement("div");
  row.className = "msg-row " + (role === "user" ? "user" : "bot");

  var avatarHTML = role === "user"
    ? '<div class="msg-avatar">👤</div>'
    : '<div class="msg-avatar">🏠</div>';

  var contentHTML = buildMessageContent(text);

  row.innerHTML =
    avatarHTML +
    '<div class="msg-content-wrap">' +
      '<div class="msg-bubble">' + contentHTML + '</div>' +
      '<div class="msg-time">' + timeStr + '</div>' +
    '</div>';

  // Insert before typing indicator
  messages.insertBefore(row, typingRow);

  // Append Main Menu after bot messages
  if (role === "bot") {
    appendMainMenu(messages, typingRow);
  }

  scrollToBottom();
}

// ─────────────────────────────────────────────────────────────────────────────
// Render: Main Menu quick-reply buttons
// ─────────────────────────────────────────────────────────────────────────────
var MENU_ITEMS = [
  { emoji: "🏠", label: "Roofing Services",     prompt: "Tell me about your roofing services." },
  { emoji: "🪟", label: "Windows & Siding",      prompt: "What window and siding services do you offer?" },
  { emoji: "🌧️", label: "Gutters & Repairs",     prompt: "What gutter and repair services do you offer?" },
  { emoji: "📅", label: "Free Estimate",          prompt: "How do I schedule a free estimate?" },
  { emoji: "📞", label: "Contact Us",             prompt: "How can I contact PJ Fitzpatrick?" },
];

function appendMainMenu(container, beforeNode) {
  var menuDiv = document.createElement("div");
  menuDiv.className = "main-menu";

  MENU_ITEMS.forEach(function(item) {
    var btn = document.createElement("button");
    btn.className = "menu-btn";
    btn.innerHTML = item.emoji + " " + item.label;
    btn.onclick = function() {
      if (!conversationActive) { return; }
      sendMessageText(item.prompt);
    };
    menuDiv.appendChild(btn);
  });

  container.insertBefore(menuDiv, beforeNode);
  scrollToBottom();
}

// ─────────────────────────────────────────────────────────────────────────────
// UI helpers
// ─────────────────────────────────────────────────────────────────────────────
function scrollToBottom() {
  var messages = document.getElementById("chatMessages");
  messages.scrollTop = messages.scrollHeight;
}

function showTyping(visible) {
  document.getElementById("typingRow").classList.toggle("visible", visible);
  if (visible) { scrollToBottom(); }
}

function setInputEnabled(enabled) {
  document.getElementById("inputField").disabled = !enabled;
  document.getElementById("sendBtn").disabled    = !enabled;
  if (enabled) {
    setTimeout(function() { document.getElementById("inputField").focus(); }, 50);
  }
}

function autoResize(el) {
  el.style.height = "auto";
  el.style.height = Math.min(el.scrollHeight, 120) + "px";
}

// ─────────────────────────────────────────────────────────────────────────────
// Conversation: Start
// ─────────────────────────────────────────────────────────────────────────────
function startConversation() {
  // Reset state
  conversationHistory = [];
  transcriptLines = [];
  sessionId = generateUUID();
  conversationActive = true;

  // Clear messages
  var messages = document.getElementById("chatMessages");
  messages.innerHTML = "";

  // Re-insert typing row
  var typingRow = document.createElement("div");
  typingRow.className = "msg-row typing-row";
  typingRow.id = "typingRow";
  typingRow.innerHTML =
    '<div class="msg-avatar">🏠</div>' +
    '<div class="typing-bubble">' +
      '<div class="typing-dot"></div>' +
      '<div class="typing-dot"></div>' +
      '<div class="typing-dot"></div>' +
    '</div>';
  messages.appendChild(typingRow);

  // Toggle buttons
  document.getElementById("btnStart").disabled  = true;
  document.getElementById("btnEnd").disabled    = false;
  document.getElementById("btnExport").disabled = false;
  setInputEnabled(true);

  // Show welcome message
  var welcomeText = "Hi there, welcome to PJ Fitzpatrick — America's Roofing Company! I'm PJ, your AI roofing advisor. What brings you here today?";
  var now = new Date().toISOString();

  appendMessage("bot", welcomeText, now);
  transcriptLines.push("[" + now + "] PJ: " + welcomeText);
  logToSheet("bot", welcomeText);
}

// ─────────────────────────────────────────────────────────────────────────────
// Conversation: End
// ─────────────────────────────────────────────────────────────────────────────
function endConversation() {
  if (!conversationActive) { return; }
  conversationActive = false;

  var endText = "Thanks for chatting — it was great helping you today! Feel free to come back anytime. 🏠";
  var now = new Date().toISOString();

  appendMessage("bot", endText, now);
  transcriptLines.push("[" + now + "] PJ: " + endText);
  logToSheet("bot", endText);

  setInputEnabled(false);
  document.getElementById("btnEnd").disabled  = true;
  document.getElementById("btnStart").disabled = false;
}

// ─────────────────────────────────────────────────────────────────────────────
// Conversation: Send message
// ─────────────────────────────────────────────────────────────────────────────
function handleKeyDown(e) {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
}

function sendMessage() {
  var field = document.getElementById("inputField");
  var text = field.value.trim();
  if (!text || !conversationActive) { return; }
  field.value = "";
  field.style.height = "auto";
  sendMessageText(text);
}

function sendMessageText(text) {
  if (!text || !conversationActive) { return; }

  var now = new Date().toISOString();
  appendMessage("user", text, now);
  transcriptLines.push("[" + now + "] You: " + text);
  logToSheet("user", text);

  conversationHistory.push({ role: "user", content: text });

  setInputEnabled(false);
  showTyping(true);

  callClaude();
}

// ─────────────────────────────────────────────────────────────────────────────
// Claude API call via Netlify proxy
// ─────────────────────────────────────────────────────────────────────────────
async function callClaude() {
  try {
    var response = await fetch(PROXY_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        model: "claude-sonnet-4-20250514",
        max_tokens: 400,
        system: SYSTEM_PROMPT,
        messages: conversationHistory,
      }),
    });

    var data = await response.json();

    showTyping(false);

    if (data.content && data.content[0] && data.content[0].text) {
      var reply = data.content[0].text.trim();
      var ts    = new Date().toISOString();

      conversationHistory.push({ role: "assistant", content: reply });
      appendMessage("bot", reply, ts);
      transcriptLines.push("[" + ts + "] PJ: " + reply);
      logToSheet("bot", reply);
    } else {
      var errMsg = "I'm sorry, I ran into an issue. Please try again or call us at 1-877-246-4354.";
      appendMessage("bot", errMsg, new Date().toISOString());
    }

    if (conversationActive) { setInputEnabled(true); }

  } catch (err) {
    showTyping(false);
    var errMsg = "I seem to be having connection issues. Please call us at 1-877-246-4354 for immediate help.";
    appendMessage("bot", errMsg, new Date().toISOString());
    if (conversationActive) { setInputEnabled(true); }
    console.error("Claude API error:", err);
  }
}

// ─────────────────────────────────────────────────────────────────────────────
// Google Sheets logging — GET + URL params
// ─────────────────────────────────────────────────────────────────────────────
function logToSheet(role, message) {
  if (!APPS_SCRIPT_URL || APPS_SCRIPT_URL.indexOf("Replace") === 0) { return; }

  var uuid = generateUUID();
  var params = new URLSearchParams({
    action:    "log",
    uuid:      uuid,
    sessionId: sessionId,
    role:      role,
    message:   message,
  });

  // Fire and forget — no await needed for logging
  fetch(APPS_SCRIPT_URL + "?" + params.toString())
    .catch(function(err) { console.warn("Sheet log failed:", err); });
}

// ─────────────────────────────────────────────────────────────────────────────
// Export transcript to TXT file
// ─────────────────────────────────────────────────────────────────────────────
function exportTranscript() {
  if (transcriptLines.length === 0) { return; }

  var now = new Date();

  // Build filename: transcript-MMDDYY-HHmm
  var mm   = String(now.getMonth() + 1).padStart(2, "0");
  var dd   = String(now.getDate()).padStart(2, "0");
  var yy   = String(now.getFullYear()).slice(-2);
  var hh   = String(now.getHours()).padStart(2, "0");
  var min  = String(now.getMinutes()).padStart(2, "0");
  var filename = "transcript-" + mm + dd + yy + "-" + hh + min + ".txt";

  var header = [
    "PJ Fitzpatrick — AI Roofing Advisor",
    "Transcript exported: " + now.toLocaleString(),
    "Session ID: " + sessionId,
    "─".repeat(50),
    "",
  ].join("\n");

  var content = header + transcriptLines.join("\n");

  var blob = new Blob([content], { type: "text/plain;charset=utf-8" });
  var url  = URL.createObjectURL(blob);
  var a    = document.createElement("a");
  a.href     = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
</script>
</body>
</html>
